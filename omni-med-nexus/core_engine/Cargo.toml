[package]
name = "core_engine"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.44"
redis = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio-native-tls"] }
tokio = { version = "1.52.3", features = ["full"] }
