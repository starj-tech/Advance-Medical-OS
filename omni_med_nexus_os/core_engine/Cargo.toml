[package]
name = "core_engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
rusqlite = "0.31"
sha2 = "0.10.8"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flutter_rust_bridge = "=2.12.0"
once_cell = "1.18.0"
aes-gcm = "0.10.3"
rand = "0.8.5"
hex = "0.4.3"
