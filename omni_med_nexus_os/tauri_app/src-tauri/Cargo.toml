[package]
name = "omnimed_tauri"
version = "0.1.0"
description = "Tauri Backend for Omni-Med Nexus OS"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5.0", features = [] }

[dependencies]
tauri = { version = "1.5.0", features = ["api-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
rusqlite = "0.31"
sha2 = "0.10.8"
chrono = "0.4"
aes-gcm = "0.10.3"
rand = "0.8.5"
hex = "0.4"
serialport = "4.3.0"
once_cell = "1.18.0"
