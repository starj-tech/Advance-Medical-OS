name: Omni-Med Nexus OS CI/CD Pipeline

on:
  push:
    branches: ["main", "staging"]
  pull_request:
    branches: ["main", "staging"]

jobs:
  core-engine-tests:
    name: Rust Core Engine Tests & Linting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            omni-med-nexus/core_engine/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Check Formatting
        working-directory: ./omni-med-nexus/core_engine
        run: cargo fmt --all -- --check

      - name: Run Clippy Linter
        working-directory: ./omni-med-nexus/core_engine
        run: cargo clippy -- -D warnings

      - name: Run Unit Tests
        working-directory: ./omni-med-nexus/core_engine
        run: cargo test --verbose

  web-apps:
    name: Web Apps Lint & Build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app: [abecca_main, abecca_admin, abecca_demo, abecca_it]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: omni-med-nexus/${{ matrix.app }}/package-lock.json

      - name: Install Dependencies
        working-directory: ./omni-med-nexus/${{ matrix.app }}
        run: npm ci

      - name: Lint
        working-directory: ./omni-med-nexus/${{ matrix.app }}
        run: npm run lint

      - name: Test
        working-directory: ./omni-med-nexus/${{ matrix.app }}
        run: npm run test --if-present

      - name: Build
        working-directory: ./omni-med-nexus/${{ matrix.app }}
        run: npm run build

  infrastructure-validation:
    name: Terraform Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./omni-med-nexus/infrastructure/terraform
        run: terraform init -backend=false

      - name: Terraform Format Check
        working-directory: ./omni-med-nexus/infrastructure/terraform
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: ./omni-med-nexus/infrastructure/terraform
        run: terraform validate
